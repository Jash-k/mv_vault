name: Historical catalogue and episode recovery
on:
  workflow_dispatch:
    inputs:
      budget_min:
        description: 'Crawl budget in minutes (checkpointed/resumable)'
        default: '90'
      metadata_budget_min:
        description: 'Independent metadata budget in minutes'
        default: '20'
permissions:
  contents: write
concurrency:
  group: vault-writer-${{ github.repository }}
  cancel-in-progress: false
jobs:
  historic:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Recover accessible historical titles and episodes
        env:
          TMDB_KEYS: ${{ secrets.TMDB_KEYS || secrets.TMDB_API_KEY }}
          MOVIESDA_HOST: ${{ vars.MOVIESDA_HOST }}
          CRAWL_MIN: ${{ inputs.budget_min }}
          META_MIN: ${{ inputs.metadata_budget_min }}
        run: node src/historic.mjs --budget-min="$CRAWL_MIN" --metadata-budget-min="$META_MIN" --concurrency=3
      - name: Publish refreshed JSON and coverage
        run: |
          git config user.name 'mv-vault'
          git config user.email 'actions@users.noreply.github.com'
          git add data/ reports/
          if ! git diff --cached --quiet; then
            git commit -m 'Historical recovery and metadata refresh'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-coverage-${{ github.run_id }}
          path: reports/
