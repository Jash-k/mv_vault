name: A–Z archive (resumable, runs on through the letters)

# Walks /tamil-movies/<letter>/?page=N from data/az.json onwards and does NOT
# stop at the end of a letter: it continues a→z inside the same run until the
# budget runs out. Next run resumes from the saved cursor. After z the cursor
# rolls back to 'a' and a fresh pass starts (that is how re-uploads and new
# arrivals in old letters get picked up).
on:
  schedule:
    - cron: '43 19 * * *'        # 01:13 IST next day
  workflow_dispatch:
    inputs:
      budget_min:
        description: 'Stop cleanly after N minutes (default 300 = 5h)'
        default: ''
      max_items:
        description: 'Stop after N new walks (default: all new items)'
        default: ''
      only:
        description: 'Only items whose path contains this text (manual test)'
        default: ''
      dry:
        description: 'Dry run — scrape and log, write nothing'
        type: boolean
        default: false
      commit:
        description: 'Commit + push the result'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: vault-writer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  az:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Scrape and publish
        env:
          TMDB_KEYS: ${{ secrets.TMDB_KEYS || secrets.TMDB_API_KEY }}
          MAX_ITEMS: ${{ inputs.max_items }}
          BUDGET: ${{ inputs.budget_min }}
          ONLY: ${{ inputs.only }}
          DRY: ${{ inputs.dry }}
          COMMIT: ${{ inputs.commit }}
        run: |
          ARGS="--mode=az"
          [ -n "$MAX_ITEMS" ] && ARGS="$ARGS --max-items=$MAX_ITEMS"
          [ -n "$BUDGET" ] && ARGS="$ARGS --budget-min=$BUDGET"
          [ -n "$ONLY" ] && ARGS="$ARGS --only=$ONLY"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry"
          [ "$COMMIT" != "false" ] && ARGS="$ARGS --commit"
          echo "node src/run.mjs $ARGS"
          node src/run.mjs $ARGS
