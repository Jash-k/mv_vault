name: Enrich (posters, ratings, categories)

# Fills what the scrape alone cannot: poster, rating, tmdbId, imdbId and the
# CATEGORY (tamil-movie / tamil-dubbed-movie / tamil-series / tamil-dubbed-series).
# Bounded TMDB searches plus source-page cast/director corroboration.
# Episode/player data is not read or changed by enrichment.
#
# verify_ids = true also re-checks records whose STORED tmdbId resolves to a
# different title (a wrong match from the old pipeline) and replaces it — and its
# poster/rating — only when an exact title+year match is found. Off by default:
# nothing already in the vault is ever rewritten without it.
#
# Put ALL your TMDB keys in one secret named TMDB_KEYS, comma-separated:
#   key1,key2,key3,…  (11 keys)
# They are used round-robin; a throttled key is parked for 10 minutes on its own
# and the run carries on with the next one. A rejected key is retired by itself.
# The run only stops if EVERY key is throttled or rejected.
#
# Run by hand from the Actions tab. Safe to repeat: records already done are
# skipped, and records TMDB has no exact match for fall back to the site's
# /tamil-dubbed-movies/ section and are marked categorySource: "site".
# Use stale_days later to let TMDB replace those site guesses.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max records this run (0 = all eligible records, bounded by the budget)'
        default: '0'
      retry_misses:
        description: 'Retry all previous misses using improved title/season matching'
        type: boolean
        default: false
      stale_days:
        description: 'Also re-try records last looked at N+ days ago (0 = only never-tried)'
        default: '0'
      budget_min:
        description: 'Stop cleanly after N minutes (default 20)'
        default: ''
      concurrency:
        description: 'Parallel TMDB lookups (default 4; 8 is plenty)'
        default: ''
      verify_ids:
        description: 'Re-match stored TMDB ids whose title does not match (corrects wrong old matches)'
        type: boolean
        default: false
      dry:
        description: 'Dry run — look up and log, write nothing'
        type: boolean
        default: false
      commit:
        description: 'Commit + push the result'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: vault-writer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Enrich
        env:
          TMDB_KEYS: ${{ secrets.TMDB_KEYS || secrets.TMDB_API_KEY }}
          LIMIT: ${{ inputs.limit }}
          RETRY_MISSES: ${{ inputs.retry_misses }}
          STALE: ${{ inputs.stale_days }}
          CONCURRENCY: ${{ inputs.concurrency }}
          VERIFY_IDS: ${{ inputs.verify_ids }}
          BUDGET: ${{ inputs.budget_min }}
          DRY: ${{ inputs.dry }}
          COMMIT: ${{ inputs.commit }}
        run: |
          ARGS="--mode=enrich"
          [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ] && ARGS="$ARGS --limit=$LIMIT"
          [ "$RETRY_MISSES" = "true" ] && ARGS="$ARGS --retry-misses"
          [ -n "$STALE" ] && [ "$STALE" != "0" ] && ARGS="$ARGS --stale-days=$STALE"
          [ -n "$BUDGET" ] && ARGS="$ARGS --budget-min=$BUDGET"
          [ -n "$CONCURRENCY" ] && ARGS="$ARGS --concurrency=$CONCURRENCY"
          [ "$VERIFY_IDS" = "true" ] && ARGS="$ARGS --verify-ids"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry"
          [ "$COMMIT" != "false" ] && ARGS="$ARGS --commit"
          echo "node src/run.mjs $ARGS"
          node src/run.mjs $ARGS
