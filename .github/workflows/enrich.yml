name: Enrich (posters, ratings, categories)

# Durable metadata-only queue. New releases and old pending records are both
# retried; zero ratings / absent upstream artwork do not starve identity work.
# Every attempt has a reason + finite retry time in state.json and the artifact.
# All writers use the same concurrency group. No episode/player data is changed.
on:
  schedule:
    - cron: '47 3,15 * * *'       # safety net: 09:17 / 21:17 IST (Actions may delay)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max records (0 = all eligible, still bounded by time budget)'
        default: '0'
      retry_misses:
        description: 'Force unresolved/unavailable attempts now; normally automatic backoff applies'
        type: boolean
        default: false
      stale_days:
        description: 'Also force eligible attempts older than N days (0 = automatic retry schedule)'
        default: '0'
      budget_min:
        description: 'Metadata-only budget in minutes (default 20)'
        default: ''
      concurrency:
        description: 'Parallel metadata lookups (default 4, maximum 8)'
        default: ''
      verify_ids:
        description: 'Also re-check stored IDs; preserve metadata on unresolved/conflicting identity'
        type: boolean
        default: false
      dry:
        description: 'Look up and log, write nothing'
        type: boolean
        default: false
      commit:
        description: 'Commit + push data changes'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: vault-writer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Enrich
        env:
          TMDB_KEYS: ${{ secrets.TMDB_KEYS || secrets.TMDB_API_KEY }}
          LIMIT: ${{ inputs.limit }}
          RETRY_MISSES: ${{ inputs.retry_misses }}
          STALE: ${{ inputs.stale_days }}
          CONCURRENCY: ${{ inputs.concurrency }}
          VERIFY_IDS: ${{ inputs.verify_ids }}
          BUDGET: ${{ inputs.budget_min }}
          DRY: ${{ inputs.dry }}
          COMMIT: ${{ inputs.commit }}
        run: |
          ARGS="--mode=enrich --report=reports/metadata.json"
          [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ] && ARGS="$ARGS --limit=$LIMIT"
          [ "$RETRY_MISSES" = "true" ] && ARGS="$ARGS --retry-misses"
          [ -n "$STALE" ] && [ "$STALE" != "0" ] && ARGS="$ARGS --stale-days=$STALE"
          [ -n "$BUDGET" ] && ARGS="$ARGS --budget-min=$BUDGET"
          [ -n "$CONCURRENCY" ] && ARGS="$ARGS --concurrency=$CONCURRENCY"
          [ "$VERIFY_IDS" = "true" ] && ARGS="$ARGS --verify-ids"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry"
          [ "$COMMIT" != "false" ] && ARGS="$ARGS --commit"
          node src/run.mjs $ARGS
      - name: Metadata diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-enrich-${{ github.run_id }}
          path: reports/metadata.json
          if-no-files-found: ignore
          retention-days: 14
