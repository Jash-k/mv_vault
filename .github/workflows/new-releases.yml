name: New releases (Tamil movies and series)

# Every six hours: latest series listing + stored current-year series + year folders.
# Series refresh after five hours, so schedule jitter cannot skip the next run.
# Paginated episode/season/quality pages are walked and merged, never replaced.
# STORED LINKS ARE PROBED EVERY RUN. When the site rebuilds a release
# (PreDVD → Original) the old stream IDs go dead — they still answer, but with an
# empty page. A stored movie is otherwise never looked at again, so the check
# probes each record's top link (a series: its first + newest episode) and
# re-walks the page only when a link is proven dead. Dead links are dropped and
# the fresh verified ones merged in; anything merely unreachable (403/429/5xx/
# timeout) is KEPT. check_all = true widens the check to the whole vault (~2,900
# probes, a few minutes) for the old A–Z catalogue.
on:
  schedule:
    - cron: '17 */6 * * *'        # 05:47, 11:47, 17:47, 23:47 IST
  workflow_dispatch:
    inputs:
      year:
        description: 'Only this year folder, e.g. 2027 (leave empty for current + next)'
        default: ''
      budget_min:
        description: 'Stop cleanly after N minutes (default 25)'
        default: ''
      max_items:
        description: 'Stop after N new walks (default: all new items)'
        default: ''
      check_all:
        description: 'Probe EVERY stored record in the vault, not just the ones on this year folder'
        type: boolean
        default: false
      no_link_check:
        description: 'Skip the stored-link health check for this run'
        type: boolean
        default: false
      with_series:
        description: 'Read series listing + refresh stored current-year series (on by default)'
        type: boolean
        default: true
      refresh_days:
        description: 'Also re-walk stored MOVIES older than N days (default 0 = never)'
        default: ''
      verbose:
        description: 'Print a line for every item, including plain skips'
        type: boolean
        default: false
      dry:
        description: 'Dry run — scrape and log, write nothing'
        type: boolean
        default: false
      commit:
        description: 'Commit + push the result'
        type: boolean
        default: true

permissions:
  contents: write

# Same group as az-archive.yml: only one writer at a time, never cancelled.
concurrency:
  group: vault-writer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  releases:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Scrape and publish
        env:
          TMDB_KEYS: ${{ secrets.TMDB_KEYS || secrets.TMDB_API_KEY }}
          YEAR: ${{ inputs.year }}
          MAX_ITEMS: ${{ inputs.max_items }}
          BUDGET: ${{ inputs.budget_min }}
          REFRESH_DAYS: ${{ inputs.refresh_days }}
          VERBOSE: ${{ inputs.verbose }}
          WITH_SERIES: ${{ inputs.with_series }}
          CHECK_ALL: ${{ inputs.check_all }}
          NO_LINK_CHECK: ${{ inputs.no_link_check }}
          DRY: ${{ inputs.dry }}
          COMMIT: ${{ inputs.commit }}
        run: |
          ARGS="--mode=releases"
          [ -n "$YEAR" ] && ARGS="$ARGS --year=$YEAR"
          [ -n "$MAX_ITEMS" ] && ARGS="$ARGS --max-items=$MAX_ITEMS"
          [ -n "$BUDGET" ] && ARGS="$ARGS --budget-min=$BUDGET"
          [ -n "$REFRESH_DAYS" ] && [ "$REFRESH_DAYS" != "0" ] && ARGS="$ARGS --refresh-days=$REFRESH_DAYS"
          [ "$VERBOSE" = "true" ] && ARGS="$ARGS --verbose"
          [ "$WITH_SERIES" = "false" ] && ARGS="$ARGS --no-series"
          [ "$CHECK_ALL" = "true" ] && ARGS="$ARGS --check-all"
          [ "$NO_LINK_CHECK" = "true" ] && ARGS="$ARGS --no-link-check"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry"
          [ "$COMMIT" != "false" ] && ARGS="$ARGS --commit"
          echo "node src/run.mjs $ARGS"
          node src/run.mjs $ARGS
