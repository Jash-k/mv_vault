name: New releases (Tamil year folder + latest series)

# Checks ONLY:
#   /tamil-<current year>-movies/   (all pages — 2026 today)
#   /tamil-<next year>-movies/      (all pages — 2027 today; the folder already
#                                    exists as a placeholder, so a title added
#                                    there is picked up with no code change at
#                                    the year rollover)
#   /tamil-web-series-download/     (latest 3 pages)
# Anything already stored is skipped without a single request, and the run always
# prints WHY each item was skipped ("· ... 379 items (361 movies, 18 series) →
# 0 walked · skipped: 304 stored · 66 series · window · 9 stored (another path)").
#
# Movies are done once they are stored. refresh_days=N re-walks stored movies
# older than N days, when you want a way to pick up re-uploads.
on:
  schedule:
    - cron: '17 */6 * * *'        # 05:47, 11:47, 17:47, 23:47 IST
  workflow_dispatch:
    inputs:
      year:
        description: 'Only this year folder, e.g. 2027 (leave empty for current + next)'
        default: ''
      budget_min:
        description: 'Stop cleanly after N minutes (default 25)'
        default: ''
      max_items:
        description: 'Stop after N new walks (default: all new items)'
        default: ''
      refresh_days:
        description: 'Also re-walk stored MOVIES older than N days (default 0 = never)'
        default: ''
      verbose:
        description: 'Print a line for every item, including plain skips'
        type: boolean
        default: false
      dry:
        description: 'Dry run — scrape and log, write nothing'
        type: boolean
        default: false
      commit:
        description: 'Commit + push the result'
        type: boolean
        default: true

permissions:
  contents: write

# Same group as az-archive.yml: only one writer at a time, never cancelled.
concurrency:
  group: vault-writer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  releases:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Scrape and publish
        env:
          TMDB_KEYS: ${{ secrets.TMDB_KEYS || secrets.TMDB_API_KEY }}
          YEAR: ${{ inputs.year }}
          MAX_ITEMS: ${{ inputs.max_items }}
          BUDGET: ${{ inputs.budget_min }}
          REFRESH_DAYS: ${{ inputs.refresh_days }}
          VERBOSE: ${{ inputs.verbose }}
          DRY: ${{ inputs.dry }}
          COMMIT: ${{ inputs.commit }}
        run: |
          ARGS="--mode=releases"
          [ -n "$YEAR" ] && ARGS="$ARGS --year=$YEAR"
          [ -n "$MAX_ITEMS" ] && ARGS="$ARGS --max-items=$MAX_ITEMS"
          [ -n "$BUDGET" ] && ARGS="$ARGS --budget-min=$BUDGET"
          [ -n "$REFRESH_DAYS" ] && [ "$REFRESH_DAYS" != "0" ] && ARGS="$ARGS --refresh-days=$REFRESH_DAYS"
          [ "$VERBOSE" = "true" ] && ARGS="$ARGS --verbose"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry"
          [ "$COMMIT" != "false" ] && ARGS="$ARGS --commit"
          echo "node src/run.mjs $ARGS"
          node src/run.mjs $ARGS
