name: TMDB backfill (one-off)

# Fills poster / rating / tmdbId / imdbId for records that are missing them.
# Touches no scraped data and makes no site requests — one TMDB call per record.
#
# Run it by hand from the Actions tab (defaults are safe: 20 min, 200 records).
# Repeat it as often as you like; records TMDB has no exact match for are marked
# in state.json (`tmdbMiss`) and are NOT retried on the next run.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max records this run (default 200)'
        default: '200'
      stale_days:
        description: 'Also retry records whose last look was N+ days ago (default 0 = never retry)'
        default: '0'
      budget_min:
        description: 'Stop cleanly after N minutes (default 20)'
        default: ''
      dry:
        description: 'Dry run — look up and log, write nothing'
        type: boolean
        default: false
      commit:
        description: 'Commit + push the result'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: vault-writer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Backfill
        env:
          TMDB_KEYS: ${{ secrets.TMDB_KEYS || secrets.TMDB_API_KEY }}
          LIMIT: ${{ inputs.limit }}
          STALE: ${{ inputs.stale_days }}
          BUDGET: ${{ inputs.budget_min }}
          DRY: ${{ inputs.dry }}
          COMMIT: ${{ inputs.commit }}
        run: |
          ARGS="--mode=tmdb"
          [ -n "$LIMIT" ] && ARGS="$ARGS --limit=$LIMIT"
          [ -n "$STALE" ] && [ "$STALE" != "0" ] && ARGS="$ARGS --stale-days=$STALE"
          [ -n "$BUDGET" ] && ARGS="$ARGS --budget-min=$BUDGET"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry"
          [ "$COMMIT" != "false" ] && ARGS="$ARGS --commit"
          echo "node src/run.mjs $ARGS"
          node src/run.mjs $ARGS
