name: Vault Scrape (durable onestream embeds)

# Three ways to run, one workflow:
#
#   schedule (02:30 UTC)  → nightly `--incremental`: new arrivals + due retries
#                            + partial re-walks
#   schedule (08:30 UTC)  → the same, six hours later. This is what makes
#                            "failed" items cheap: a page that could not be read
#                            at 02:30 is re-tried at 08:30 instead of tomorrow.
#   workflow_dispatch     → incremental | sweep | letters, on demand
#
# Every run is resumable: data/state.json remembers every item already walked and
# WHEN each one is next worth looking at, so a run that hits its budget simply
# stops and the next one continues.
#
# v2.1 publish rules (the important part):
#   · state.json        → ALWAYS committed (it is the resume bookmark)
#   · last-run.json     → ALWAYS committed (the run's self-reported health)
#   · vault.json + the derived manifest/index/stats → committed ONLY if
#     src/verify.js passed. A failing vault leaves the previous good file in
#     place, exactly as the README always claimed.
#   · a degraded run (feeds down, or ~all items coming back empty) is published
#     to last-run.json, surfaced in the job summary and filed as an issue.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental | sweep | letters | posters (site posters, no key needed) | enrich (TMDB metadata)'
        type: choice
        options: [incremental, sweep, letters, posters, enrich]
        default: incremental
        required: true
      letters:
        description: 'mode=letters only — e.g. "a-c" (range) or "a,d,h" (pick list)'
        default: 'a-z'
        required: false
      max_pages:
        description: 'Max listing pages per section (0 = all)'
        default: '0'
        required: false
      max_movies:
        description: 'Max items this run (kept under the 6h job cap)'
        default: '250'
        required: false
      budget_min:
        description: 'Soft time budget in minutes (stop gracefully)'
        default: '330'
        required: false
  schedule:
    - cron: '30 2 * * *'  # 08:00 IST — new arrivals
    - cron: '30 8 * * *'  # 14:00 IST — second chance for anything that failed

permissions:
  contents: write
  issues: write

concurrency:
  group: moviesda-vault
  cancel-in-progress: false

jobs:
  vault:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (lockfile-exact, no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Unit tests (offline, no deps)
        run: node --test

      # `inputs.*` is empty for the scheduled trigger, so defaults are resolved
      # here. Values reach the shell through `env:`, never through ${{ }} inside
      # a `run:` block.
      - name: Resolve run mode
        id: cfg
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_LETTERS: ${{ inputs.letters }}
          IN_PAGES: ${{ inputs.max_pages }}
          IN_MAX: ${{ inputs.max_movies }}
          IN_BUDGET: ${{ inputs.budget_min }}
          EVENT: ${{ github.event_name }}
        run: |
          MODE="${IN_MODE:-incremental}"
          LETTERS="${IN_LETTERS:-a-z}"
          PAGES="${IN_PAGES:-0}"
          MAX="${IN_MAX:-250}"
          BUDGET="${IN_BUDGET:-330}"
          if [ "$EVENT" = "schedule" ]; then
            MODE=incremental
            # at ~1.2 s/item these still finish in a few minutes, and the
            # 1,179-item retry backlog drains in days instead of weeks
            MAX=400
            BUDGET=90
          fi
          {
            echo "mode=$MODE"
            echo "letters=$LETTERS"
            echo "pages=$PAGES"
            echo "max=$MAX"
            echo "budget=$BUDGET"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$MODE max=$MAX budget=${BUDGET}min"

      - name: Scrape (resumable)
        id: scrape
        continue-on-error: true
        env:
          TMDB_KEYS: ${{ secrets.TMDB_KEYS || secrets.TMDB_API_KEY }}
          VAULT_MAX_PAGES: ${{ steps.cfg.outputs.pages }}
          VAULT_MAX_MOVIES: ${{ steps.cfg.outputs.max }}
          VAULT_BUDGET_MIN: ${{ steps.cfg.outputs.budget }}
          MODE: ${{ steps.cfg.outputs.mode }}
          LETTERS: ${{ steps.cfg.outputs.letters }}
          # the run must not be killed by a wobbling host or a slow timeout
          VAULT_TIMEOUT_MS: '15000'
          VAULT_ATTEMPTS: '3'
          VAULT_BREAKER_AFTER: '8'
        run: |
          case "$MODE" in
            letters) node src/cli.js "--letters=$LETTERS" ;;
            sweep)   node src/cli.js --sweep ;;
            posters) node src/cli.js --posters=0 ;;   # 0 = every poster-less record
            enrich)  node src/enrich.js --concurrency=6 ;;
            *)       node src/cli.js --incremental ;;
          esac 2>&1 | tee run.log

      - name: Vault integrity check (gate)
        id: verify
        continue-on-error: true
        run: node src/verify.js 2>&1 | tee verify.log

      # A vault that failed the check is not published: restore the deliverable
      # AND every derived file that was rebuilt from it.
      - name: Withhold a vault that failed verification
        if: steps.verify.outcome != 'success'
        run: |
          echo "::error::verify failed — vault.json and its derived files will NOT be published"
          git checkout -- data/vault.json data/manifest.json data/index.json data/vault-stats.json || true
          rm -f data/*.tmp

      - name: Commit progress (always — the run must be resumable)
        if: always()
        run: |
          git config user.name "vault-bot"
          git config user.email "actions@users.noreply.github.com"
          # state + run report are the run's memory: always committed
          git add data/state.json data/last-run.json data/liveness.json 2>/dev/null || true
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            git add data/vault.json data/vault-stats.json data/manifest.json data/index.json
          fi
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "vault: ${{ steps.cfg.outputs.mode }} update $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Conflict-proof publish: runs are serialized by the concurrency
          # group, so the only competing writer is a MANUAL push (code upload).
          # If the rebase hits it, fold this run's data on top of origin
          # instead of dying — machine-written data must always survive.
          if ! git pull --rebase origin main; then
            echo "Rebase conflict — recovering: our data files win wholesale."
            git rebase --abort
            git fetch origin main
            git reset --soft origin/main
            git add data/state.json data/last-run.json data/liveness.json 2>/dev/null || true
            if [ "${{ steps.verify.outcome }}" = "success" ]; then
              git add data/vault.json data/vault-stats.json data/manifest.json data/index.json
            fi
            git commit -m "vault: ${{ steps.cfg.outputs.mode }} update (recovered) $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi
          git push

      - name: Run summary
        if: always()
        run: |
          {
            echo "### Vault run — ${{ steps.cfg.outputs.mode }}"
            echo ""
            echo "scrape: \`${{ steps.scrape.outcome }}\` · verify: \`${{ steps.verify.outcome }}\`"
            echo ""
            if [ -f data/last-run.json ]; then
              node -e '
                const r = require("./data/last-run.json");
                const c = r.counts || {};
                const line = (k, v) => `- ${k}: **${v}**`;
                console.log(line("added", c.added), line("merged", c.merged), line("empty", c.empty),
                            line("partial", c.partial), line("failed", c.failed), line("mirror rescues", r.http?.mirrorRescues ?? 0),
                            line("degraded", r.degraded), r.problems?.length ? `- problems: ${r.problems.join("; ")}` : "");
              ' >> "$GITHUB_STEP_SUMMARY" || true
            fi
            echo '```'
            grep -E '^\[vault\] ' run.log | tail -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # "nothing new today" and "I could not look properly" are different facts.
      # A degraded run gets an issue, so silence is never mistaken for calm.
      #
      # NOTIFICATION ONLY: the run's data was already committed by the step above,
      # so nothing here may fail the job. It also creates its own label — `gh
      # issue create --label` refuses to attach a label that does not exist yet,
      # and "the label does not exist" is a silly reason to fail a good run.
      - name: File an issue when the run was degraded
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED: ${{ steps.scrape.outcome }}
        run: |
          if [ ! -f data/last-run.json ]; then exit 0; fi
          DEGRADED=$(node -e 'const r=require("./data/last-run.json");console.log(r.degraded||r.integrity===false?"yes":"no")')
          if [ "$DEGRADED" != "yes" ] && [ "$FAILED" = "success" ]; then exit 0; fi
          BODY=$(node -e 'const r=require("./data/last-run.json");console.log(`counts: ${JSON.stringify(r.counts)}\nproblems: ${(r.problems||[]).join("; ")||"none"}\nrequests: ${r.requests} · mirror rescues: ${r.http?.mirrorRescues}`)')
          TITLE="Vault run needs attention ($(date -u +%Y-%m-%d))"

          notify() {
            # the label is how a later run finds today's open issue: create it on
            # first use (no-op if it already exists, or if we lack the permission)
            gh label create vault-degraded --color FBCA04 \
              --description "Automatic vault run needed attention" >/dev/null 2>&1 || true
            local n
            n=$(gh issue list --label vault-degraded --state open --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$n" ]; then
              gh issue comment "$n" --body "$BODY"
            else
              # if the label is unavailable for any reason, still file the issue
              gh issue create --title "$TITLE" --body "$BODY" --label vault-degraded \
                || gh issue create --title "$TITLE" --body "$BODY"
            fi
          }

          if ! notify; then
            # no issue filed, but the run must not stay silent about a problem
            {
              echo "### ⚠ Vault needs attention — could not file an issue"
              echo ""
              echo '```'
              printf '%s\n' "$BODY"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
